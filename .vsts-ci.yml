jobs:
  - job: build
    strategy:
      matrix:
        linux:
          osName: 'Linux'
          imageName: 'ubuntu-latest'
        mac:
          osName: 'macOS'
          imageName: 'macOS-latest'
        windows:
          osName: 'Windows'
          imageName: 'windows-latest'

    displayName: Build
    timeoutInMinutes: 60
    pool:
      vmImage: $(imageName)

    steps:
      # Prerequisites
      - checkout: self
        submodules: true

      - task: Bash@3
        displayName: Install tools
        inputs:
          targetType: inline
          script: |
            sudo apt-get -yq install dos2unix
        condition: eq(variables.osName, 'Linux')

      # Setup .NET
      - task: UseDotNet@2
        displayName: Install .NET 10.0 SDK for build
        inputs:
          packageType: 'sdk'
          version: '10.0.x'

      # Display version info
      - script: dotnet --info
        displayName: Version Information

      # Build & Package
      - powershell: ./make.ps1
        displayName: Build

      - powershell: ./make.ps1 package
        displayName: Package

      - task: CopyFiles@2
        displayName: Copy Build Logs
        inputs:
          Contents: '*.binlog'
          TargetFolder: '$(Build.ArtifactStagingDirectory)'
        condition: and(succeededOrFailed(), eq(variables['system.pullrequest.isfork'], false))

      - task: CopyFiles@2
        displayName: Copy Packages
        inputs:
          SourceFolder: '$(Build.Repository.LocalPath)/dist/Release/Packages'
          Contents: |
            **/*.nupkg
            **/*.snupkg
            **/*.zip
            **/*.msi
            **/*.deb
            **/*.pkg
          TargetFolder: '$(Build.ArtifactStagingDirectory)'
        condition: and(succeededOrFailed(), eq(variables['system.pullrequest.isfork'], false))

      - task: PublishBuildArtifacts@1
        displayName: Publish Artifacts
        inputs:
          ArtifactName: '$(osName) Artifacts'
        condition: and(succeededOrFailed(), eq(variables['system.pullrequest.isfork'], false))

  - job: test
    strategy:
      matrix:
        linux_net462:
          osName: Linux
          imageName: ubuntu-latest
          framework: net462
        linux_net8_0:
          osName: Linux
          imageName: ubuntu-latest
          framework: net8.0
        macos_net462:
          osName: macOS
          imageName: macOS-latest
          framework: net462
        macos_net8_0:
          osName: macOS
          imageName: macOS-latest
          framework: net8.0
        windows_net462:
          osName: Windows
          imageName: windows-latest
          framework: net462
        windows_net8_0:
          osName: Windows
          imageName: windows-latest
          framework: net8.0
        linux_net10_0:
          osName: Linux
          imageName: ubuntu-latest
          framework: net10.0
        macos_net10_0:
          osName: macOS
          imageName: macOS-latest
          framework: net10.0
        windows_net10_0:
          osName: Windows
          imageName: windows-latest
          framework: net10.0

    displayName: Test
    timeoutInMinutes: 60
    pool:
      vmImage: $(imageName)

    steps:
      # Prerequisites
      - checkout: self
        submodules: true

      # Setup .NET
      - task: UseDotNet@2
        displayName: Install .NET 10.0 SDK for build
        inputs:
          packageType: 'sdk'
          version: '10.0.x'
      - task: UseDotNet@2
        displayName: Install .NET 8.0 runtime for testing
        inputs:
          packageType: 'runtime'
          version: '8.0.x'
        condition: eq(variables.framework, 'net8.0')

      # Setup Mono (the runner images no longer include it)
      - bash: |
          if [ "$(osName)" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "##vso[task.prependpath]$HOMEBREW_PREFIX/bin"
          fi
          brew install mono
        displayName: Install Mono
        condition: and(ne(variables.osName, 'Windows'), eq(variables.framework, 'net462'))

      # Build & Test
      - powershell: ./make.ps1
        displayName: Build
      - powershell: ./make.ps1 ngen
        displayName: NGen
        condition: and(succeeded(), eq(variables.osName, 'Windows'), eq(variables.framework, 'net462'))
      - powershell: ./make.ps1 -frameworks $(framework) readytorun
        displayName: ReadyToRun
        condition: and(succeeded(), ne(variables.framework, 'net462'))
      - powershell: |
          $ipy = "bin/Release/$(framework)/ipy"
          if ('$(framework)' -ne 'net462') { dotnet "$ipy.dll" -VV }
          elseif ('$(osName)' -eq 'Windows') { & "$ipy.exe" -VV }
          else {
            mono --version
            mono "$ipy.exe" -VV
          }
        displayName: Version Information ($(framework))
      - powershell: ./make.ps1 -frameworks $(framework) test-all
        displayName: Test ($(framework))

      - task: PublishTestResults@2
        displayName: Publish Test Results
        inputs:
          testRunner: VSTest
          testResultsFiles: '**/*.trx'
          mergeTestResults: true
          testRunTitle: $(osName) - $(framework)
        condition: succeededOrFailed()
